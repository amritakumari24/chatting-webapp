<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    

     <h1>Chatting WebApp</h1>

    <input type="text" id="username" placeholder="Enter username" id="userName" />
    <br><br>
<div class="msg-container">
    <input type="text" id="message" placeholder="Enter message" class="msg" />
    <button id="sendBtn">Send</button>
    </div>

    <div id="messages"></div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const sendBtn = document.getElementById("sendBtn");
        const messageInput = document.getElementById("message");
        const usernameInput = document.getElementById("username");
        const allMessages = document.getElementById("messages");

        // Incoming messages
        socket.on('message', (data) => {
            const p = document.createElement('p');

            p.innerText = `${data.username}: ${data.message}`;
            p.style.textAlign = "left";

            allMessages.appendChild(p);
        });

        // Send message
        sendBtn.addEventListener("click", () => {

            const message = messageInput.value;
            const username = usernameInput.value;

            // Send object
            socket.emit('user-message', {
                username,
                message
            });

            // Show own message
            const p = document.createElement('p');

            p.innerText = `You (${username}): ${message}`;
            p.style.textAlign = "right";

            allMessages.appendChild(p);

            messageInput.value = "";
        });

    </script>
</body>
</html>
